name: Capture published GhoulHouse proof

on:
  push:
    branches: [codex/ghoulhouse-homepage-proof-and-qa]

permissions:
  contents: write

jobs:
  own-site-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ghoulhouse-homepage-proof-and-qa
      - name: Capture real public ghoulhouse.fi
        run: node scripts/capture-production-proof.mjs
      - name: Commit screenshot only to the review branch
        run: |
          if git ls-files --error-unmatch public/ghoulhouse-site-proof.png >/dev/null 2>&1; then
            echo "Proof screenshot already versioned."
            exit 0
          fi
          test -s public/ghoulhouse-site-proof.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ghoulhouse-site-proof.png
          git commit -m "assets(home): add actual published-site proof capture"
          git push origin HEAD:codex/ghoulhouse-homepage-proof-and-qa
