name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/p0-production-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/ghoulhouse-next.log 2>&1 &
          echo $! > /tmp/ghoulhouse-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ghoulhouse-next.log
          exit 1

      - name: Canonical domain QA
        shell: bash
        run: |
          curl --silent --head --header 'Host: ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/apex-headers.txt
          grep -qi '^HTTP/.* 200' /tmp/apex-headers.txt

          if grep -qi '^location:' /tmp/apex-headers.txt; then
            echo "::error::Canonical apex host must not redirect."
            cat /tmp/apex-headers.txt
            exit 1
          fi

          curl --silent --head --header 'Host: www.ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/www-headers.txt
          grep -qi '^HTTP/.* 301' /tmp/www-headers.txt
          grep -qi '^location: https://ghoulhouse.fi/' /tmp/www-headers.txt

      - name: Lead API QA
        shell: bash
        run: |
          invalid_status="$(curl --silent --output /tmp/lead-invalid.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"

          test "$invalid_status" = "400"
          grep -q '"validation_error"' /tmp/lead-invalid.json

          cross_site_status="$(curl --silent --output /tmp/lead-cross-site.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header 'sec-fetch-site: cross-site' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"

          test "$cross_site_status" = "403"
          grep -q '"cross_site_request"' /tmp/lead-cross-site.json

      - name: SEO safety QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ \
            | grep -qi "x-robots-tag: noindex, nofollow, noarchive, noimageindex"

          robots="$(curl --fail --silent http://127.0.0.1:3000/robots.txt)"
          printf '%s\n' "$robots" | grep -q "Disallow: /"

      - name: Security headers QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ > /tmp/headers.txt

          grep -qi "content-security-policy-report-only:" /tmp/headers.txt
          grep -qi "default-src 'self'" /tmp/headers.txt
          grep -qi "frame-ancestors 'none'" /tmp/headers.txt
          grep -qi "cross-origin-opener-policy: same-origin" /tmp/headers.txt
          grep -qi "x-permitted-cross-domain-policies: none" /tmp/headers.txt

          if grep -qi "^content-security-policy:" /tmp/headers.txt; then
            echo "::error::CSP enforcement must remain off until Preview validation is complete."
            exit 1
          fi

      - name: Browser QA
        run: node scripts/browser-qa-ci.mjs

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7


  exact-commit-preview:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_zwsvoePoiBeskRuyl2Iar883
      VERCEL_PROJECT_ID: prj_yClSuc4kuRrCpRKbBM9iieVhAx9B
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source provenance
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Exact preview source: $actual_sha"

      - name: Verify Vercel credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not available."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull isolated Preview settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build exact Preview candidate
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy exact Preview candidate
        id: preview
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Exact-commit Preview: $url"
          echo "Source SHA: $EXPECTED_SHA"

      - name: Preview route and conversion smoke QA
        shell: bash
        run: |
          url="${{ steps.preview.outputs.url }}"

          home="$(vercel curl / --deployment "$url" --token="$VERCEL_TOKEN" 2>/dev/null)"
          printf '%s' "$home" | grep -q "TYÖMAAKUVAT SISÄÄN"
          printf '%s' "$home" | grep -q "PYYDÄ 2 SISÄLTÖESIMERKKIÄ"
          printf '%s' "$home" | grep -q "logo-horizontal.svg"
          printf '%s' "$home" | grep -q 'data-offer-name="SOME 12"'
          printf '%s' "$home" | grep -q 'data-offer-price="490"'

          some12="$(vercel curl /some-12 --deployment "$url" --token="$VERCEL_TOKEN" 2>/dev/null)"
          printf '%s' "$some12" | grep -q "490"
          printf '%s' "$some12" | grep -q "PYYDÄ 2 SISÄLTÖESIMERKKIÄ"

          cases="$(vercel curl /caset --deployment "$url" --token="$VERCEL_TOKEN" 2>/dev/null)"
          printf '%s' "$cases" | grep -q "KONSEPTIESIMERKKI — EI ASIAKASTYÖ"

          pilot="$(vercel curl /kylpyhuoneremontit --deployment "$url" --token="$VERCEL_TOKEN" 2>/dev/null)"
          printf '%s' "$pilot" | grep -q "Performance MVP"
          printf '%s' "$pilot" | grep -q 'noindex'

          lead_api="$(vercel curl /api/leads --deployment "$url" --token="$VERCEL_TOKEN" -- -X POST -H 'content-type: application/json' --data '{}' 2>/dev/null || true)"
          printf '%s' "$lead_api" | grep -q '"validation_error"'

          vercel logs --deployment "$url" --level error --limit 50 --token="$VERCEL_TOKEN" > /tmp/preview-errors.log || true
          if [ -s /tmp/preview-errors.log ]; then
            echo "::error::Exact-commit Preview emitted runtime errors."
            cat /tmp/preview-errors.log
            exit 1
          fi
