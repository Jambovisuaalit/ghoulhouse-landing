name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/p0-production-foundation

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/ghoulhouse-next.log 2>&1 &
          echo $! > /tmp/ghoulhouse-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ghoulhouse-next.log
          exit 1

      - name: Canonical domain QA
        shell: bash
        run: |
          curl --silent --head --header 'Host: ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/apex-headers.txt
          grep -qi '^HTTP/.* 200' /tmp/apex-headers.txt
          if grep -qi '^location:' /tmp/apex-headers.txt; then
            echo "::error::Canonical apex host must not redirect."
            cat /tmp/apex-headers.txt
            exit 1
          fi

          curl --silent --head --header 'Host: www.ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/www-headers.txt
          grep -qi '^HTTP/.* 308' /tmp/www-headers.txt
          grep -qi '^location: https://ghoulhouse.fi/' /tmp/www-headers.txt

      - name: Lead API QA
        shell: bash
        run: |
          invalid_status="$(curl --silent --output /tmp/lead-invalid.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"
          test "$invalid_status" = "400"
          grep -q '"validation_error"' /tmp/lead-invalid.json

          cross_site_status="$(curl --silent --output /tmp/lead-cross-site.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header 'sec-fetch-site: cross-site' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"
          test "$cross_site_status" = "403"
          grep -q '"cross_site_request"' /tmp/lead-cross-site.json

          form_headers="$(mktemp)"
          form_status="$(curl --silent --output /dev/null --dump-header "$form_headers" --write-out '%{http_code}' \
            --max-redirs 0 \
            --request POST \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data 'intent=photos&fax=qa-honeypot' \
            http://127.0.0.1:3000/api/leads)"
          test "$form_status" = "303"
          grep -Eqi '^location: .*\/kiitos' "$form_headers"

      - name: Lead confirmation and service-specific routing QA
        run: node scripts/lead-confirmation-qa.mjs

      - name: Lead validation and message length QA
        run: node scripts/lead-validation-qa.mjs

      - name: SEO safety QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ \
            | grep -qi "x-robots-tag: noindex, nofollow, noarchive, noimageindex"
          robots="$(curl --fail --silent http://127.0.0.1:3000/robots.txt)"
          printf '%s\n' "$robots" | grep -q "Disallow: /"

          html="$(curl --fail --silent http://127.0.0.1:3000/)"
          printf '%s' "$html" | grep -q '<title>GhoulHouse | Verkkosivut, Social &amp; SEO palveluyrityksille</title>'
          printf '%s' "$html" | grep -q 'rel="canonical" href="https://ghoulhouse.fi"'
          printf '%s' "$html" | grep -q 'twitter:card'
          printf '%s' "$html" | grep -q 'summary_large_image'

      - name: Company master data QA
        shell: bash
        run: |
          html="$(curl --fail --silent http://127.0.0.1:3000/)"
          printf '%s' "$html" | grep -q "Ghoulhouse Oy"
          printf '%s' "$html" | grep -q "3651127-5"
          printf '%s' "$html" | grep -q "Helsinki"
          printf '%s' "$html" | grep -q '"foundingDate":"2026-09-03"'

          if printf '%s' "$html" | grep -Eq "Y-tunnus annettu 30\.8\.2026|perustamisvaiheessa|vireillä|rekisteröimätön|rekisteröitymätön"; then
            echo "::error::Obsolete company registration wording found in rendered site."
            exit 1
          fi

          privacy="$(curl --fail --silent http://127.0.0.1:3000/tietosuoja)"
          printf '%s' "$privacy" | grep -q "Kaupparekisterissä 3.9.2026 alkaen"
          printf '%s' "$privacy" | grep -q "c/o Hanna Nyholm"
          printf '%s' "$privacy" | grep -q "Maasälväntie 2 A 3"
          printf '%s' "$privacy" | grep -q "00710"
          printf '%s' "$privacy" | grep -q "Google Analytics 4"
          if printf '%s' "$privacy" | grep -qi "Plausible"; then
            echo "::error::Stale Plausible privacy disclosure remains after GA4 migration."
            exit 1
          fi

      - name: Design system and scoped homepage CSS QA
        shell: bash
        run: |
          test -e src/app/site.css
          test -e src/app/homepage.css
          grep -qi -- '--signal: #C9282D' src/app/homepage.css
          grep -q -- '--brand-ink:#111111' src/app/site.css
          grep -q -- '--brand-signal:#C9282D' src/app/site.css
          grep -q -- '--brand-ghost:#F7F4EF' src/app/site.css
          grep -q -- '--brand-bone:#E6DFD5' src/app/site.css
          grep -q -- '--muted:#8C8278' src/app/site.css
          grep -q -- '--outer-max:1440px' src/app/site.css
          grep -q -- '--content-max:1280px' src/app/site.css
          grep -q -- '--prose-max:760px' src/app/site.css

          node <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('src/app/site.css', 'utf8');
          const widths = [...css.matchAll(/@media\s*\(min-width:\s*(\d+)px\)/g)].map((m) => Number(m[1]));
          const allowed = new Set([640, 768, 1024, 1280, 1440]);
          const invalid = widths.filter((value) => !allowed.has(value));
          if (invalid.length) throw new Error(`Non-canonical breakpoints: ${invalid.join(', ')}`);
          NODE

          test ! -e public/logo-horizontal.svg
          test ! -e public/logo-horizontal-white.svg
          test ! -e src/app/icon.tsx
          if grep -RqiE 'logo-horizontal|markSvg|chicken-leg|standalone.*wordmark' src public 2>/dev/null; then
            echo "::error::A fabricated or unavailable logo master is referenced in runtime source."
            exit 1
          fi

          html="$(curl --fail --silent http://127.0.0.1:3000/)"
          printf '%s' "$html" | grep -q "HYVÄ TYÖ"
          printf '%s' "$html" | grep -q "PITÄÄ NÄKYÄ"
          printf '%s' "$html" | grep -qi "Oma sivusto — ei asiakasreferenssi"
          printf '%s' "$html" | grep -q 'href="/verkkosivut-yritykselle"'
          printf '%s' "$html" | grep -q 'href="/some-sisallontuotanto"'
          printf '%s' "$html" | grep -q 'href="/resurssit"'

      - name: Analytics QA
        shell: bash
        run: |
          legacy_analytics_terms=(
            "VercelAnalytics"
            "NEXT_PUBLIC_VERCEL_ANALYTICS_ENABLED"
            "va.vercel-scripts.com"
            "vitals.vercel-insights.com"
            "PlausibleAnalytics"
            "NEXT_PUBLIC_PLAUSIBLE_SCRIPT_SRC"
            "plausible.io"
          )
          for term in "${legacy_analytics_terms[@]}"; do
            if git grep -niF -- "$term" -- src next.config.js .env.example; then
              echo "::error::Legacy analytics integration remains in tracked runtime config: $term"
              exit 1
            fi
          done
          grep -q "GoogleAnalytics" src/app/layout.tsx
          grep -q "G-43VQ8505YL" src/components/analytics/GoogleAnalytics.tsx
          grep -q "www.googletagmanager.com/gtag/js" src/components/analytics/GoogleAnalytics.tsx
          grep -q "gtag('config', 'G-43VQ8505YL')" src/components/analytics/GoogleAnalytics.tsx
          grep -q "target.gtag('event'" src/lib/analytics.ts
          grep -q "https://www.googletagmanager.com" next.config.js
          grep -q "https://www.google-analytics.com" next.config.js
          grep -q "https://region1.google-analytics.com" next.config.js

      - name: Security headers QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ > /tmp/headers.txt
          grep -qi "content-security-policy-report-only:" /tmp/headers.txt
          grep -qi "default-src 'self'" /tmp/headers.txt
          grep -qi "frame-ancestors 'none'" /tmp/headers.txt
          grep -qi "https://www.googletagmanager.com" /tmp/headers.txt
          grep -qi "https://www.google-analytics.com" /tmp/headers.txt
          grep -qi "https://region1.google-analytics.com" /tmp/headers.txt
          if grep -qi "plausible.io" /tmp/headers.txt; then
            echo "::error::Plausible CSP allowance remains after GA4 migration."
            exit 1
          fi
          grep -qi "cross-origin-opener-policy: same-origin" /tmp/headers.txt
          grep -qi "x-permitted-cross-domain-policies: none" /tmp/headers.txt
          if grep -qi "^content-security-policy:" /tmp/headers.txt; then
            echo "::error::CSP enforcement must remain off until Preview validation is complete."
            exit 1
          fi

      - name: Browser QA
        run: node scripts/browser-qa-ci.mjs

      - name: Full-page responsive and consent QA
        run: node scripts/homepage-fullpage-qa.mjs

      - name: Launch visual and accessibility QA
        run: node scripts/launch-visual-a11y-qa.mjs

      - name: No-JS QA
        run: node scripts/no-js-qa-ci.mjs

      - name: Resolve this PR's exact Vercel preview
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/resolve-pr-preview.mjs

      - name: Vercel Preview full-page responsive QA
        if: github.event_name == 'pull_request'
        env:
          QA_SCREENSHOT_DIR: qa-artifacts/preview
        run: node scripts/homepage-fullpage-qa.mjs

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
