name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/p0-production-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/ghoulhouse-next.log 2>&1 &
          echo $! > /tmp/ghoulhouse-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ghoulhouse-next.log
          exit 1

      - name: Canonical domain QA
        shell: bash
        run: |
          curl --silent --head --header 'Host: ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/apex-headers.txt
          grep -qi '^HTTP/.* 200' /tmp/apex-headers.txt

          if grep -qi '^location:' /tmp/apex-headers.txt; then
            echo "::error::Canonical apex host must not redirect."
            cat /tmp/apex-headers.txt
            exit 1
          fi

          curl --silent --head --header 'Host: www.ghoulhouse.fi' http://127.0.0.1:3000/ > /tmp/www-headers.txt
          grep -qi '^HTTP/.* 301' /tmp/www-headers.txt
          grep -qi '^location: https://ghoulhouse.fi/' /tmp/www-headers.txt

      - name: Lead API QA
        shell: bash
        run: |
          invalid_status="$(curl --silent --output /tmp/lead-invalid.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"

          test "$invalid_status" = "400"
          grep -q '"validation_error"' /tmp/lead-invalid.json

          cross_site_status="$(curl --silent --output /tmp/lead-cross-site.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header 'sec-fetch-site: cross-site' \
            --data '{}' \
            http://127.0.0.1:3000/api/leads)"

          test "$cross_site_status" = "403"
          grep -q '"cross_site_request"' /tmp/lead-cross-site.json

          form_headers="$(mktemp)"
          form_status="$(curl --silent --output /dev/null --dump-header "$form_headers" --write-out '%{http_code}' \
            --max-redirs 0 \
            --request POST \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data 'intent=photos&fax=qa-honeypot' \
            http://127.0.0.1:3000/api/leads)"

          test "$form_status" = "303"
          grep -Eqi '^location: .*\/kiitos' "$form_headers"

      - name: SEO safety QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ \
            | grep -qi "x-robots-tag: noindex, nofollow, noarchive, noimageindex"

          robots="$(curl --fail --silent http://127.0.0.1:3000/robots.txt)"
          printf '%s\n' "$robots" | grep -q "Disallow: /"

      - name: Company master data QA
        shell: bash
        run: |
          html="$(curl --fail --silent http://127.0.0.1:3000/)"
          printf '%s' "$html" | grep -q "Ghoulhouse Oy"
          printf '%s' "$html" | grep -q "3651127-5"
          printf '%s' "$html" | grep -q "Kotipaikka"
          printf '%s' "$html" | grep -q "Helsinki"
          printf '%s' "$html" | grep -q "Kaupparekisterissä 3.9.2026 alkaen"
          printf '%s' "$html" | grep -q '"foundingDate":"2026-09-03"'

          if printf '%s' "$html" | grep -Eq "Y-tunnus annettu 30\.8\.2026|perustamisvaiheessa|vireillä|rekisteröimätön|rekisteröitymätön"; then
            echo "::error::Obsolete company registration wording found in rendered site."
            exit 1
          fi

          privacy="$(curl --fail --silent http://127.0.0.1:3000/tietosuoja)"
          printf '%s' "$privacy" | grep -q "Kaupparekisterissä 3.9.2026 alkaen"
          printf '%s' "$privacy" | grep -q "c/o Hanna Nyholm"
          printf '%s' "$privacy" | grep -q "Maasälväntie 2 A 33"
          printf '%s' "$privacy" | grep -q "00710"

      - name: Security headers QA
        shell: bash
        run: |
          curl --silent --head http://127.0.0.1:3000/ > /tmp/headers.txt

          grep -qi "content-security-policy-report-only:" /tmp/headers.txt
          grep -qi "default-src 'self'" /tmp/headers.txt
          grep -qi "frame-ancestors 'none'" /tmp/headers.txt
          grep -qi "cross-origin-opener-policy: same-origin" /tmp/headers.txt
          grep -qi "x-permitted-cross-domain-policies: none" /tmp/headers.txt

          if grep -qi "^content-security-policy:" /tmp/headers.txt; then
            echo "::error::CSP enforcement must remain off until Preview validation is complete."
            exit 1
          fi

      - name: Logo QA
        shell: bash
        run: |
          grep -q 'viewBox=' public/logo-horizontal.svg
          if grep -qi '<text' public/logo-horizontal.svg; then
            echo "::error::Logo wordmark must be path-only; live SVG text is not allowed."
            exit 1
          fi
          grep -q '<path' public/logo-horizontal.svg

      - name: Browser QA
        run: node scripts/browser-qa-ci.mjs

      - name: Launch visual and accessibility QA
        run: node scripts/launch-visual-a11y-qa.mjs

      - name: No-JS QA
        run: node scripts/no-js-qa-ci.mjs

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

  deploy_cutover:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ops: deploy ghoulhouse-oy and move domains'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_zwsvoePoiBeskRuyl2Iar883
      VERCEL_PROJECT_ID: prj_Xf2QTX7hkMQhdhGdcyQyMTv78weK
      SOURCE_PROJECT_ID: prj_EXsZg5RrTkEfIbs30VLHmWmjJlxL
      TARGET_PROJECT_ID: prj_Xf2QTX7hkMQhdhGdcyQyMTv78weK
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret missing"; exit 1; }
          echo "Deploying $GITHUB_SHA to ghoulhouse-oy"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production candidate
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Smoke-test deployment URL
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for i in {1..20}; do
            html="$(vercel curl / --deployment "$url" --token="$VERCEL_TOKEN" 2>/dev/null || true)"
            if printf '%s' "$html" | grep -q "TYÖMAAKUVAT" && printf '%s' "$html" | grep -q "490 €"; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Production deployment did not pass smoke QA"
          exit 1

      - name: Move ghoulhouse.fi to ghoulhouse-oy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"projectId\":\"$TARGET_PROJECT_ID\",\"gitBranch\":null}" \
            "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/ghoulhouse.fi/move?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/apex-move.json

      - name: Move www.ghoulhouse.fi and redirect to apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"projectId\":\"$TARGET_PROJECT_ID\",\"gitBranch\":null,\"redirect\":\"ghoulhouse.fi\",\"redirectStatusCode\":308}" \
            "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/www.ghoulhouse.fi/move?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/www-move.json

      - name: Verify domains and live routing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/domains.json

          grep -q '"name":"ghoulhouse.fi"' /tmp/domains.json
          grep -q '"name":"www.ghoulhouse.fi"' /tmp/domains.json

          for i in {1..20}; do
            apex_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://ghoulhouse.fi/ || true)"
            if [ "$apex_code" = "200" ]; then
              break
            fi
            sleep 3
          done
          test "$apex_code" = "200"

          curl --silent --show-error --head https://ghoulhouse.fi/ | tee /tmp/apex-headers.txt
          curl --silent --show-error --head https://www.ghoulhouse.fi/ | tee /tmp/www-headers.txt
          grep -qi '^HTTP/.* 200' /tmp/apex-headers.txt
          grep -qi '^HTTP/.* 308' /tmp/www-headers.txt
          grep -qi '^location: https://ghoulhouse.fi/' /tmp/www-headers.txt

      - name: Release summary
        shell: bash
        run: |
          echo "Source commit: $GITHUB_SHA"
          echo "Project: ghoulhouse-oy ($TARGET_PROJECT_ID)"
          echo "Production: ${{ steps.deploy.outputs.url }}"
          echo "Apex: https://ghoulhouse.fi"
          echo "WWW: https://www.ghoulhouse.fi -> https://ghoulhouse.fi (308)"
          echo "Registrar DNS: unchanged"
