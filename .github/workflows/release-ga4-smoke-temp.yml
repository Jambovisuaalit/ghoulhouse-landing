name: Release GA4 smoke (temporary)

on:
  push:
    branches: [qa/ga4-release-0be7]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE_URL: https://ghoulhouse-v5-runtime-qa.vercel.app
      QA_SCREENSHOT_DIR: qa-artifacts/release-ga4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: HTTP metadata security and image negotiation preflight
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent "$QA_BASE_URL/")"
          printf '%s' "$html" | grep -q '<title>GhoulHouse | Työmaakuvat sisään. Valmis some ulos.</title>'
          printf '%s' "$html" | grep -q 'rel="canonical" href="https://ghoulhouse.fi"'
          printf '%s' "$html" | grep -q '<meta name="robots" content="index, follow"'
          printf '%s' "$html" | grep -q 'property="og:title"'
          printf '%s' "$html" | grep -q 'twitter:card'
          printf '%s' "$html" | grep -q 'application/ld+json'
          if printf '%s' "$html" | grep -q 'rel="canonical" href="https://ghoulhouse-v5-runtime-'; then
            echo '::error::QA URL leaked into canonical.'
            exit 1
          fi

          headers="$(mktemp)"
          curl --silent --head "$QA_BASE_URL/" > "$headers"
          grep -qi '^x-robots-tag:.*noindex' "$headers"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"
          grep -qi '^permissions-policy:' "$headers"
          grep -qi '^cross-origin-opener-policy: same-origin' "$headers"
          grep -qi '^content-security-policy:' "$headers"
          if grep -qi '^content-security-policy-report-only:' "$headers"; then
            echo '::error::Production-target QA must exercise enforced CSP.'
            exit 1
          fi
          grep -qi 'https://www.googletagmanager.com' "$headers"
          grep -qi 'https://www.google-analytics.com' "$headers"
          grep -qi 'https://region1.google-analytics.com' "$headers"
          if grep -qi 'plausible.io' "$headers"; then
            echo '::error::Plausible remains in QA CSP.'
            exit 1
          fi

          image_path='/_next/image?url=https%3A%2F%2Fimages.unsplash.com%2Fphoto-1768321917661-d4f1a89d2185%3Fauto%3Dformat%26fit%3Dcrop%26q%3D86%26w%3D1800&w=640&q=75'
          avif_headers="$(mktemp)"
          webp_headers="$(mktemp)"
          curl --fail --silent --output /dev/null --dump-header "$avif_headers" -H 'Accept: image/avif' "$QA_BASE_URL$image_path"
          curl --fail --silent --output /dev/null --dump-header "$webp_headers" -H 'Accept: image/webp' "$QA_BASE_URL$image_path"
          grep -qi '^content-type: image/avif' "$avif_headers"
          grep -qi '^content-type: image/webp' "$webp_headers"

          invalid_status="$(curl --silent --output /tmp/lead-invalid.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' "$QA_BASE_URL/api/leads")"
          test "$invalid_status" = '400'
          grep -q '"validation_error"' /tmp/lead-invalid.json

      - name: Canonical browser smoke
        run: node scripts/browser-qa-ci.mjs

      - name: Visual and accessibility smoke
        run: node scripts/launch-visual-a11y-qa.mjs

      - name: No-JS smoke
        run: node scripts/no-js-qa-ci.mjs

      - name: Expanded boundary form reduced-motion and GA4 runtime smoke
        run: node scripts/release-ga4-smoke-v2-temp.mjs

      - name: Upload release smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ga4-smoke
          path: qa-artifacts/release-ga4/
          if-no-files-found: warn
          retention-days: 2
