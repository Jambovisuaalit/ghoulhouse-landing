name: Migrate GhoulHouse production once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-production-once.yml
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: ghoulhouse-production
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'ops: execute one-time Vercel consolidation') ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'RUN GHOULHOUSE VERCEL CONSOLIDATION' &&
       contains(github.event.issue.body, 'nonce=ghoulhouse-cutover-20260830-v1'))
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_zwsvoePoiBeskRuyl2Iar883
      VERCEL_PROJECT_ID: prj_Xf2QTX7hkMQhdhGdcyQyMTv78weK
      OLD_PROJECT_ID: prj_LDmPUItb4oGQlzU2ZZAgyjs7rfLw
      OLD_PROJECT_NAME: ghoulhouse-landing-1ig9
      TARGET_PROJECT_ID: prj_Xf2QTX7hkMQhdhGdcyQyMTv78weK
      TARGET_PROJECT_NAME: ghoulhouse-oy
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CANONICAL_URL: https://ghoulhouse.fi
      WWW_URL: https://www.ghoulhouse.fi

    steps:
      - name: Report migration start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "MIGRATION_STARTED sha=${GITHUB_SHA}"

      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Verify release source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret is unavailable."
            exit 1
          fi
          echo "Migration source: ${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate V2 release source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Freeze legacy Git source
        env:
          VERCEL_PROJECT_ID: ${{ env.OLD_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID}" > .vercel/project.json

          disconnect_output="$(printf 'y\n' | vercel git disconnect --token="${VERCEL_TOKEN}" 2>&1 || true)"
          printf '%s\n' "${disconnect_output}"

          if printf '%s' "${disconnect_output}" | grep -Eqi 'error:.*(permission|unauthorized|forbidden|token)'; then
            echo "::error::Vercel refused legacy Git disconnect."
            exit 1
          fi

          vercel env pull /tmp/ghoulhouse-legacy-production.env \
            --environment=production \
            --token="${VERCEL_TOKEN}"

      - name: Report legacy Git frozen
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "LEGACY_GIT_FROZEN"

      - name: Link target project and verify production environment
        env:
          VERCEL_PROJECT_ID: ${{ env.TARGET_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${VERCEL_ORG_ID}" "${TARGET_PROJECT_ID}" > .vercel/project.json

          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

          target_env="/tmp/ghoulhouse-target-production.env"
          legacy_env="/tmp/ghoulhouse-legacy-production.env"
          rm -f "${target_env}"
          vercel env pull "${target_env}" \
            --environment=production \
            --token="${VERCEL_TOKEN}"

          set -a
          [ -f "${legacy_env}" ] && . "${legacy_env}"
          set +a

          ensure_from_legacy() {
            key="$1"
            if grep -Eq "^${key}=.+$" "${target_env}"; then
              return 0
            fi

            value="$(printenv "${key}" || true)"
            if [ -z "${value}" ]; then
              echo "::error::${key} is missing from both legacy and target Production."
              exit 1
            fi

            printf '%s' "${value}" | vercel env add "${key}" production \
              --token="${VERCEL_TOKEN}"
          }

          ensure_plain_default() {
            key="$1"
            value="$2"
            if grep -Eq "^${key}=.+$" "${target_env}"; then
              return 0
            fi
            printf '%s' "${value}" | vercel env add "${key}" production \
              --token="${VERCEL_TOKEN}"
          }

          legacy_mode="$(printenv LEAD_DELIVERY_MODE || true)"
          target_mode="$(sed -n 's/^LEAD_DELIVERY_MODE=//p' "${target_env}" | tr -d '"' | tail -n1)"
          mode="${target_mode:-${legacy_mode}}"

          if [ "${mode}" = "resend" ]; then
            ensure_from_legacy LEAD_DELIVERY_MODE
            ensure_from_legacy RESEND_API_KEY
            ensure_from_legacy LEAD_TO_EMAIL
            ensure_from_legacy LEAD_FROM_EMAIL
          elif [ "${mode}" = "webhook" ]; then
            ensure_from_legacy LEAD_DELIVERY_MODE
            ensure_from_legacy LEAD_WEBHOOK_URL
          else
            echo "::error::No valid lead delivery configuration is available."
            exit 1
          fi

          ensure_plain_default CSP_ENFORCE false

          if grep -Eq '^SITE_INDEXABLE=.+$' "${target_env}"; then
            vercel env rm SITE_INDEXABLE production --yes \
              --token="${VERCEL_TOKEN}"
          fi
          printf '%s' 'true' | vercel env add SITE_INDEXABLE production \
            --token="${VERCEL_TOKEN}"

          rm -f "${target_env}"
          vercel env pull "${target_env}" \
            --environment=production \
            --token="${VERCEL_TOKEN}"

          grep -Eq '^CSP_ENFORCE=.+$' "${target_env}"
          grep -Eq '^SITE_INDEXABLE="?true"?$' "${target_env}"

          if grep -Eq '^LEAD_DELIVERY_MODE="?resend"?$' "${target_env}"; then
            grep -Eq '^RESEND_API_KEY=.+$' "${target_env}"
            grep -Eq '^LEAD_TO_EMAIL=.+$' "${target_env}"
            grep -Eq '^LEAD_FROM_EMAIL=.+$' "${target_env}"
            echo "Lead delivery mode: resend"
          elif grep -Eq '^LEAD_DELIVERY_MODE="?webhook"?$' "${target_env}"; then
            grep -Eq '^LEAD_WEBHOOK_URL="?https://.+' "${target_env}"
            echo "Lead delivery mode: webhook"
          else
            echo "::error::Production lead delivery is not configured on ghoulhouse-oy."
            exit 1
          fi

          rm -f "${target_env}" "${legacy_env}"

      - name: Build target production candidate
        env:
          VERCEL_PROJECT_ID: ${{ env.TARGET_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy target production candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Candidate deployment: ${url}"

      - name: Candidate smoke and lead QA
        env:
          VERCEL_PROJECT_ID: ${{ env.TARGET_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.candidate.outputs.url }}"

          for i in {1..20}; do
            html="$(vercel curl / --deployment "${url}" --token="${VERCEL_TOKEN}" 2>/dev/null || true)"
            if printf '%s' "${html}" | grep -q "TYÖMAAKUVA" &&                printf '%s' "${html}" | grep -q "VALMIS JULKAISU" &&                printf '%s' "${html}" | grep -q "PYYDÄ 2 MAKSUTONTA SISÄLTÖESIMERKKIÄ" &&                printf '%s' "${html}" | grep -q 'action="/api/leads"' &&                printf '%s' "${html}" | grep -q 'data-offer-name="GHOULHOUSE SOME 12"' &&                printf '%s' "${html}" | grep -q 'data-offer-price="490"'; then
              break
            fi

            if [ "${i}" -eq 20 ]; then
              echo "::error::Candidate did not return GhoulHouse V2."
              exit 1
            fi
            sleep 3
          done

          if printf '%s' "${html}" | grep -Eqi 'MANAGED|Palvelujaksosta 4|790 €'; then
            echo "::error::Candidate contains obsolete pricing lifecycle."
            exit 1
          fi

          invalid="$(vercel curl /api/leads             --deployment "${url}"             --token="${VERCEL_TOKEN}"             --             -X POST             -H 'content-type: application/json'             --data '{}' 2>/dev/null || true)"
          printf '%s' "${invalid}" | grep -q '"validation_error"'

          valid="$(vercel curl /api/leads             --deployment "${url}"             --token="${VERCEL_TOKEN}"             --             -X POST             -H 'content-type: application/json'             --data '{"intent":"photos","company":"GhoulHouse Migration QA","name":"Migration Gate","email":"release-qa@ghoulhouse.fi","profile":"https://ghoulhouse.fi","message":"Pre-cutover candidate QA. No action required."}' 2>/dev/null || true)"
          printf '%s' "${valid}" | grep -q '"ok":true'

          vercel logs --deployment "${url}" --level error --limit 50 --token="${VERCEL_TOKEN}" > /tmp/candidate-errors.log || true
          if [ -s /tmp/candidate-errors.log ]; then
            echo "::error::Candidate emitted runtime errors."
            cat /tmp/candidate-errors.log
            exit 1
          fi

      - name: Report candidate ready
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "CANDIDATE_READY url=${{ steps.candidate.outputs.url }}"

      - name: Move domains, validate live production, rollback on failure
        env:
          VERCEL_PROJECT_ID: ${{ env.TARGET_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          CUTOVER_STARTED=0
          MIGRATION_OK=0

          assign_domain() {
            local domain="$1"
            local project="$2"
            vercel domains add "${domain}" "${project}" \
              --force \
              -T "${VERCEL_ORG_ID}" \
              --token="${VERCEL_TOKEN}"
          }

          rollback_domains() {
            echo "::warning::Post-cutover QA failed. Returning custom domains to legacy project."
            assign_domain "www.ghoulhouse.fi" "${OLD_PROJECT_NAME}" >/tmp/rollback-www.log 2>&1 || true
            assign_domain "ghoulhouse.fi" "${OLD_PROJECT_NAME}" >/tmp/rollback-apex.log 2>&1 || true
          }

          cleanup() {
            status="$?"
            if [ "${CUTOVER_STARTED}" -eq 1 ] && [ "${MIGRATION_OK}" -ne 1 ]; then
              rollback_domains
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          vercel domains inspect ghoulhouse.fi -T "${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"
          vercel domains inspect www.ghoulhouse.fi -T "${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"

          assign_domain "ghoulhouse.fi" "${TARGET_PROJECT_NAME}"
          CUTOVER_STARTED=1
          assign_domain "www.ghoulhouse.fi" "${TARGET_PROJECT_NAME}"

          routing_ok=0
          for i in {1..30}; do
            apex_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${CANONICAL_URL}/" || true)"
            www_result="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' "${WWW_URL}/" || true)"
            if [ "${apex_status}" = "200" ] && [ "${www_result}" = "301 https://ghoulhouse.fi/" ]; then
              routing_ok=1
              break
            fi
            sleep 2
          done
          test "${routing_ok}" = "1"

          redirect_result="$(curl --silent --show-error --location --max-redirs 1             --output /dev/null             --write-out '%{http_code} %{num_redirects} %{url_effective}'             "${WWW_URL}/")"
          test "${redirect_result}" = "200 1 https://ghoulhouse.fi/"

          html="$(curl --fail --silent --show-error "${CANONICAL_URL}/")"
          headers="$(curl --silent --show-error --head "${CANONICAL_URL}/")"

          printf '%s' "${html}" | grep -q 'rel="canonical" href="https://ghoulhouse.fi'
          printf '%s' "${html}" | grep -q "TYÖMAAKUVA"
          printf '%s' "${html}" | grep -q "VALMIS JULKAISU"
          printf '%s' "${html}" | grep -q "PYYDÄ 2 MAKSUTONTA SISÄLTÖESIMERKKIÄ"
          printf '%s' "${html}" | grep -q 'action="/api/leads"'
          printf '%s' "${html}" | grep -q 'data-offer-name="GHOULHOUSE SOME 12"'
          printf '%s' "${html}" | grep -q 'data-offer-price="490"'

          if printf '%s' "${html}" | grep -Eqi 'MANAGED|Palvelujaksosta 4|790 €'; then
            echo "::error::Live homepage contains obsolete pricing lifecycle."
            exit 1
          fi

          printf '%s' "${headers}" | grep -qi '^x-content-type-options: nosniff'
          printf '%s' "${headers}" | grep -qi '^x-frame-options: DENY'
          printf '%s' "${headers}" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          printf '%s' "${headers}" | grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()'
          printf '%s' "${headers}" | grep -qi '^cross-origin-opener-policy: same-origin'
          printf '%s' "${headers}" | grep -qi '^content-security-policy-report-only:'

          robots="$(curl --fail --silent --show-error "${CANONICAL_URL}/robots.txt")"
          sitemap="$(curl --fail --silent --show-error "${CANONICAL_URL}/sitemap.xml")"
          printf '%s' "${robots}" | grep -q 'Allow: /'
          if printf '%s' "${robots}" | grep -q 'Disallow: /'; then
            echo "::error::Canonical robots.txt still blocks indexing."
            exit 1
          fi
          printf '%s' "${sitemap}" | grep -q '<loc>https://ghoulhouse.fi</loc>'
          printf '%s' "${sitemap}" | grep -q '<loc>https://ghoulhouse.fi/tietosuoja</loc>'

          printf '%s' "${html}" | grep -q '<meta name="robots" content="index, follow"'
          if printf '%s' "${headers}" | grep -Eqi '^x-robots-tag:.*noindex'; then
            echo "::error::Canonical response still sends a noindex header."
            exit 1
          fi

          invalid_status="$(curl --silent --show-error             --output /tmp/live-lead-invalid.json             --write-out '%{http_code}'             --request POST             --header 'content-type: application/json'             --data '{}'             "${CANONICAL_URL}/api/leads")"
          test "${invalid_status}" = "400"
          grep -q '"validation_error"' /tmp/live-lead-invalid.json

          form_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 0             --request POST             --header 'content-type: application/x-www-form-urlencoded'             --data 'intent=photos&fax=migration-honeypot'             "${CANONICAL_URL}/api/leads")"
          test "${form_status}" = "303"

          valid_status="$(curl --silent --show-error             --output /tmp/live-lead-valid.json             --write-out '%{http_code}'             --request POST             --header 'content-type: application/json'             --data '{"intent":"photos","company":"GhoulHouse Migration QA","name":"Migration Gate","email":"release-qa@ghoulhouse.fi","profile":"https://ghoulhouse.fi","message":"Post-cutover production QA. No action required."}'             "${CANONICAL_URL}/api/leads")"
          test "${valid_status}" = "201"
          grep -q '"ok":true' /tmp/live-lead-valid.json

          vercel logs --environment production --level error --since 5m --limit 50 --token="${VERCEL_TOKEN}" > /tmp/live-errors.log || true
          if [ -s /tmp/live-errors.log ]; then
            echo "::error::Production emitted runtime errors after cutover."
            cat /tmp/live-errors.log
            exit 1
          fi

          MIGRATION_OK=1
          trap - EXIT

      - name: Verify final domain configuration
        env:
          VERCEL_PROJECT_ID: ${{ env.TARGET_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vercel domains verify ghoulhouse.fi \
            --project "${TARGET_PROJECT_NAME}" \
            -T "${VERCEL_ORG_ID}" \
            --token="${VERCEL_TOKEN}"
          vercel domains verify www.ghoulhouse.fi \
            --project "${TARGET_PROJECT_NAME}" \
            -T "${VERCEL_ORG_ID}" \
            --token="${VERCEL_TOKEN}"

          echo "Validated main SHA: ${GITHUB_SHA}"
          echo "Production project: ${TARGET_PROJECT_NAME} (${TARGET_PROJECT_ID})"
          echo "Canonical: ${CANONICAL_URL}"

      - name: Report migration result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "MIGRATION_SUCCESS sha=${GITHUB_SHA} project=${TARGET_PROJECT_ID} canonical=${CANONICAL_URL}"
            gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed
          else
            gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --body "MIGRATION_FAILED status=${{ job.status }} sha=${GITHUB_SHA}; custom-domain rollback is automatic if cutover had started."
          fi
