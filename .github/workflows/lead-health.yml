name: Production lead health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-lead-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production database and notification readiness
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 https://ghoulhouse.fi/api/health/lead-storage > /tmp/lead-health.json &&
              node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/lead-health.json","utf8")); if(r.ok!==true) process.exit(1)'; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo '::error::GhoulHouse lead pipeline unavailable. Check private.lead_notification_alerts, outbox and database credentials.'
          exit 1
