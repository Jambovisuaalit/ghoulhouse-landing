name: Deploy GhoulHouse production once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DOMAIN_MOVE_TRIGGER.txt"

permissions:
  contents: read

concurrency:
  group: ghoulhouse-production-domain-move
  cancel-in-progress: false

jobs:
  move-domains:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_zwsvoePoiBeskRuyl2Iar883
      SOURCE_PROJECT_ID: prj_EXsZg5RrTkEfIbs30VLHmWmjJlxL
      TARGET_PROJECT_ID: prj_Xf2QTX7hkMQhdhGdcyQyMTv78weK
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      APEX_DOMAIN: ghoulhouse.fi
      WWW_DOMAIN: www.ghoulhouse.fi

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret missing"; exit 1; }
          echo "Moving domains from $SOURCE_PROJECT_ID to $TARGET_PROJECT_ID"

      - name: Verify source domains before move
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$SOURCE_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/source-domains.json
          grep -q '"name":"ghoulhouse.fi"' /tmp/source-domains.json
          grep -q '"name":"www.ghoulhouse.fi"' /tmp/source-domains.json

      - name: Move apex domain to ghoulhouse-oy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"projectId\":\"$TARGET_PROJECT_ID\",\"gitBranch\":null}" \
            "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/$APEX_DOMAIN/move?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/apex-move.json

      - name: Move www domain and redirect to apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"projectId\":\"$TARGET_PROJECT_ID\",\"gitBranch\":null,\"redirect\":\"$APEX_DOMAIN\",\"redirectStatusCode\":308}" \
            "https://api.vercel.com/v1/projects/$SOURCE_PROJECT_ID/domains/$WWW_DOMAIN/move?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/www-move.json

      - name: Verify target domains after move
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$TARGET_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/target-domains.json
          grep -q '"name":"ghoulhouse.fi"' /tmp/target-domains.json
          grep -q '"name":"www.ghoulhouse.fi"' /tmp/target-domains.json

      - name: Verify live routing
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            apex_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://ghoulhouse.fi/ || true)"
            if [ "$apex_code" = "200" ]; then
              break
            fi
            sleep 3
          done
          test "$apex_code" = "200"

          curl --silent --show-error --head https://ghoulhouse.fi/ | tee /tmp/apex-headers.txt
          curl --silent --show-error --head https://www.ghoulhouse.fi/ | tee /tmp/www-headers.txt

          grep -qi '^HTTP/.* 200' /tmp/apex-headers.txt
          grep -qi '^HTTP/.* 308' /tmp/www-headers.txt
          grep -qi '^location: https://ghoulhouse.fi/' /tmp/www-headers.txt

      - name: Summary
        shell: bash
        run: |
          echo "Target project: ghoulhouse-oy ($TARGET_PROJECT_ID)"
          echo "Apex: https://ghoulhouse.fi"
          echo "WWW: https://www.ghoulhouse.fi -> https://ghoulhouse.fi (308)"
          echo "Registrar DNS: unchanged"
